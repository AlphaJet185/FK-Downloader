name = "fk-downloader"
main = "worker.js"
compatibility_date = "2026-04-02"

# Cloudflare Worker runtime config.
# Set the upstream endpoint here if you need a shared base URL.
# Secrets are NOT stored in this file.
# Add them with:
#   wrangler secret put GEMINI_KEY
#   wrangler secret put AUDD_KEY
#
# Local dev:
#   npm run worker:dev
#
# Deploy:
#   npm run worker:deploy
#   or: wrangler publish
#
# Example requests:
#   https://your-worker.workers.dev/?url=<MEDIA_URL>&service=gemini
#   https://your-worker.workers.dev/?url=<MEDIA_URL>&service=audd
[vars]
UPSTREAM_API_ENDPOINT = ""

# Uncomment if you want to cache streamed files in R2.
# [[r2_buckets]]
# binding = "DOWNLOAD_CACHE"
# bucket_name = "fk-downloader-cache"
