<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FK Downloader</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      input, select, button { margin: 5px 0; padding: 8px; }
      #videoInfo img { display: block; margin-top: 10px; }
      #suggestions { list-style: none; padding: 0; margin: 5px 0; }
      .suggest-item { cursor: pointer; padding: 3px; border-bottom: 1px solid #ccc; }
      .suggest-item:hover { background-color: #f0f0f0; }
    </style>
  </head>
  <body>
    <h1>FK Downloader</h1>

    <label>Video URL:</label><br/>
    <input id="url" placeholder="Enter video URL" size="50"><br/>
    <button id="fetchInfo">Get Info</button><br/>

    <label>Available Formats:</label><br/>
    <select id="formatSelect"></select><br/>
    <button id="download">Download</button><br/><br/>

    <label>Search Suggestions:</label><br/>
    <input id="suggestInput" placeholder="Type something...">
    <ul id="suggestions"></ul>

    <div id="videoInfo"></div>

    <script src="/script.js"></script>
  </body>
</html>
